# PREMONITION Logging Configuration
# Loaded by src/premonition/utils/logging.py when PREMONITION_LOG_FILE is set.

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: '{"timestamp":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","message":"%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%SZ"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/premonition.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf-8

  prediction_audit:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/prediction_audit.log
    when: midnight
    interval: 1
    backupCount: 90
    encoding: utf-8

loggers:
  premonition:
    level: INFO
    handlers: [console, file]
    propagate: false

  premonition.audit:
    level: INFO
    handlers: [prediction_audit]
    propagate: false

root:
  level: WARNING
  handlers: [console]
