name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: premonition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: premonition/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Train model (required for API tests)
        run: python scripts/train.py --tier t1
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          PREMONITION_REALTIME_ENABLED: "false"

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: premonition/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: premonition/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: premonition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r src/premonition -ll -q || true
