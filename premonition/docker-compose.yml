# PREMONITION Docker Compose
# One-command startup: docker compose run --rm premonition-ml train
#
# Windows: same commands work in PowerShell / Docker Desktop
# Linux:   docker compose run --rm premonition-ml train

services:
  premonition-ml:
    build:
      context: .
      dockerfile: Dockerfile
    image: premonition-ml:0.1.0
    container_name: premonition-ml
    env_file:
      - .env
    volumes:
      # Persist outputs across container restarts
      - ./data/processed:/app/data/processed
      - ./models/artifacts:/app/models/artifacts
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      - PREMONITION_LOG_LEVEL=${PREMONITION_LOG_LEVEL:-INFO}
      - PREMONITION_TIER=${PREMONITION_TIER:-t1}
    # Override default command: docker compose run premonition-ml train
    command: ["help"]

  premonition-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: premonition-ml:0.1.0
    container_name: premonition-api
    env_file:
      - .env
    ports:
      - "${PREMONITION_API_PORT:-8000}:8000"
    volumes:
      - ./data/processed:/app/data/processed
      - ./models/artifacts:/app/models/artifacts
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PREMONITION_LOG_LEVEL=${PREMONITION_LOG_LEVEL:-INFO}
      - PREMONITION_TIER=${PREMONITION_TIER:-t1}
      - PREMONITION_API_HOST=0.0.0.0
      - PREMONITION_API_PORT=8000
    command: ["api"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Monitoring stack (optional — start with: docker compose --profile monitoring up)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: premonition-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - premonition-api

  grafana:
    image: grafana/grafana:10.4.0
    container_name: premonition-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/premonition.json:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
